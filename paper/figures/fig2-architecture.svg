<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:1.6; }
    .zone { fill:#f7f7f7; stroke:#999; stroke-width:1; stroke-dasharray:6 4; }
    .title { font-size:15px; font-weight:bold; fill:#111; }
    .item { font-size:12px; fill:#222; }
    .zlbl { font-size:12px; font-weight:bold; fill:#666; letter-spacing:1px; }
    .edge { stroke:#222; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .elbl { font-size:11.5px; fill:#333; }
  </style>

  <!-- Zones -->
  <rect class="zone" x="20" y="40" width="270" height="440" rx="10"/>
  <text class="zlbl" x="40" y="66">CLIENT</text>
  <rect class="zone" x="330" y="40" width="280" height="440" rx="10"/>
  <text class="zlbl" x="350" y="66">POLYGON AMOY (chain id 80002)</text>
  <rect class="zone" x="650" y="40" width="270" height="440" rx="10"/>
  <text class="zlbl" x="670" y="66">OFF-CHAIN STORAGE</text>

  <!-- Client: roles -->
  <rect class="box" x="45" y="85" width="220" height="92" rx="8"/>
  <text class="title" x="155" y="110" text-anchor="middle">Wallets (3 roles)</text>
  <text class="item" x="60" y="132">• Guest — book / check-in / review</text>
  <text class="item" x="60" y="149">• Host — list / claim / checkout</text>
  <text class="item" x="60" y="166">• Platform — tax / dispute lever</text>

  <!-- Client: frontend -->
  <rect class="box" x="45" y="205" width="220" height="120" rx="8"/>
  <text class="title" x="155" y="230" text-anchor="middle">Next.js dApp</text>
  <text class="item" x="60" y="252">• ethers.js + RainbowKit</text>
  <text class="item" x="60" y="269">• Redux state</text>
  <text class="item" x="60" y="286">• Listing / booking / trips UI</text>
  <text class="item" x="60" y="303">• NFT metadata preview</text>

  <!-- Client: pin proxy -->
  <rect class="box" x="45" y="355" width="220" height="92" rx="8"/>
  <text class="title" x="155" y="380" text-anchor="middle">Server-side pin proxy</text>
  <text class="item" x="60" y="402">/api/pinata/pin — pins image +</text>
  <text class="item" x="60" y="419">metadata JSON; API credentials</text>
  <text class="item" x="60" y="436">never reach the browser</text>

  <!-- Chain: contract -->
  <rect class="box" x="355" y="85" width="230" height="290" rx="8"/>
  <text class="title" x="470" y="110" text-anchor="middle">HospitalityBookingNFT</text>
  <text class="item" x="370" y="134">ERC-721 · Ownable · ReentrancyGuard</text>
  <line x1="370" y1="146" x2="570" y2="146" stroke="#bbb"/>
  <text class="item" x="370" y="168">• Listings + room types</text>
  <text class="item" x="370" y="186">• Per-date inventory (capacity)</text>
  <text class="item" x="370" y="204">• Escrow: book / check-in /</text>
  <text class="item" x="380" y="220">refund / no-show settlement</text>
  <text class="item" x="370" y="240">• Proof-of-stay NFT mint/burn</text>
  <text class="item" x="370" y="258">• Dynamic tokenURI (Base64 JSON</text>
  <text class="item" x="380" y="274">from live state, incl. Status)</text>
  <text class="item" x="370" y="294">• Review gate (check-in required)</text>
  <line x1="370" y1="308" x2="570" y2="308" stroke="#bbb"/>
  <text class="item" x="370" y="330">V2 variant: slim listings (IPFS</text>
  <text class="item" x="370" y="346">pointer) + paginated reads</text>

  <!-- Chain: escrow note -->
  <rect class="box" x="355" y="400" width="230" height="55" rx="8"/>
  <text class="title" x="470" y="422" text-anchor="middle" font-size="13">Escrow invariant</text>
  <text class="item" x="470" y="441" text-anchor="middle">balance = Σ active bookings (1.05P)</text>

  <!-- Off-chain: IPFS -->
  <rect class="box" x="675" y="85" width="220" height="120" rx="8"/>
  <text class="title" x="785" y="110" text-anchor="middle">IPFS (Pinata)</text>
  <text class="item" x="690" y="134">• NFT image (CID)</text>
  <text class="item" x="690" y="151">• Listing metadata JSON</text>
  <text class="item" x="690" y="168">{name, description, image}</text>
  <text class="item" x="690" y="192">Content-addressed, immutable</text>

  <!-- Off-chain: explorer -->
  <rect class="box" x="675" y="240" width="220" height="90" rx="8"/>
  <text class="title" x="785" y="265" text-anchor="middle">Public verification</text>
  <text class="item" x="690" y="288">• PolygonScan (txs, state)</text>
  <text class="item" x="690" y="305">• Wallets / marketplaces read</text>
  <text class="item" x="690" y="322">tokenURI directly on-chain</text>

  <!-- Edges -->
  <path class="edge" d="M155,177 L155,203"/>
  <path class="edge" d="M155,325 L155,353"/>
  <path class="edge" d="M265,265 L353,265"/>
  <text class="elbl" x="272" y="255">sign + send tx</text>
  <path class="edge" d="M265,401 C300,401 320,150 673,150" />
  <text class="elbl" x="300" y="392">pin image + JSON → CID</text>
  <path class="edge" d="M585,258 C630,258 640,160 673,150"/>
  <text class="elbl" x="596" y="246">image URI</text>
  <path class="edge" d="M585,180 C640,190 650,265 673,275"/>
  <text class="elbl" x="612" y="212">events,</text>
  <text class="elbl" x="612" y="225">state</text>

  <text class="elbl" x="30" y="505">Solid arrows: runtime interactions. The metadata document served by tokenURI is generated on-chain; only the image bytes live on IPFS.</text>
</svg>
