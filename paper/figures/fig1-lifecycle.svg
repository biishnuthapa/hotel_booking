<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .state { fill:#fff; stroke:#222; stroke-width:1.6; }
    .terminal { fill:#f2f2f2; }
    .lbl { font-size:15px; font-weight:bold; fill:#111; }
    .sub { font-size:11.5px; fill:#333; }
    .edge { stroke:#222; stroke-width:1.4; fill:none; marker-end:url(#arr); }
    .elbl { font-size:12px; fill:#111; font-weight:bold; }
    .flow { font-size:11px; fill:#444; }
  </style>

  <!-- Start -->
  <circle cx="40" cy="110" r="8" fill="#222"/>
  <path class="edge" d="M48,110 L148,110"/>
  <text class="elbl" x="20" y="64">bookApartment (guest)</text>
  <text class="flow" x="30" y="152">guest pays 1.05P into escrow;</text>
  <text class="flow" x="30" y="166">NFT minted to guest</text>

  <!-- Booked -->
  <rect class="state" x="150" y="75" width="160" height="70" rx="10"/>
  <text class="lbl" x="230" y="105" text-anchor="middle">Booked (0)</text>
  <text class="sub" x="230" y="126" text-anchor="middle">escrow: 1.05P held</text>

  <!-- CheckedIn -->
  <rect class="state" x="450" y="45" width="170" height="70" rx="10"/>
  <text class="lbl" x="535" y="75" text-anchor="middle">CheckedIn (2)</text>
  <text class="sub" x="535" y="96" text-anchor="middle">stay in progress</text>

  <!-- Expired -->
  <rect class="state terminal" x="720" y="130" width="140" height="70" rx="10"/>
  <text class="lbl" x="790" y="160" text-anchor="middle">Expired (3)</text>
  <text class="sub" x="790" y="181" text-anchor="middle">terminal</text>

  <!-- Cancelled -->
  <rect class="state terminal" x="150" y="330" width="180" height="70" rx="10"/>
  <text class="lbl" x="240" y="360" text-anchor="middle">Cancelled (1)</text>
  <text class="sub" x="240" y="381" text-anchor="middle">NFT burned · terminal</text>

  <!-- Booked -> CheckedIn -->
  <path class="edge" d="M310,92 C370,80 390,80 448,80"/>
  <text class="elbl" x="300" y="30">checkInApartment (guest, within [start, +24h])</text>
  <text class="flow" x="330" y="112">host +0.93P · platform +0.07P</text>
  <text class="flow" x="330" y="125">guest deposit 0.05P returned</text>

  <!-- CheckedIn -> Expired -->
  <path class="edge" d="M620,90 C680,100 695,125 722,142"/>
  <text class="elbl" x="640" y="76">checkout (host)</text>
  <text class="flow" x="640" y="90">no transfer; closes stay</text>

  <!-- Booked -> Expired (no-show) -->
  <path class="edge" d="M310,130 C520,185 600,175 718,165"/>
  <text class="elbl" x="365" y="205">claimFunds (host, after start; no-show)</text>
  <text class="flow" x="365" y="221">host +0.98P (incl. forfeited deposit) · platform +0.07P</text>

  <!-- Booked -> Cancelled -->
  <path class="edge" d="M228,145 C226,220 232,265 238,328"/>
  <text class="elbl" x="30" y="245">refundBooking (guest,</text>
  <text class="elbl" x="30" y="260">before start)</text>
  <text class="flow" x="30" y="279">guest +P (full price back)</text>
  <text class="flow" x="30" y="293">host +0.025P · platform +0.025P</text>
  <text class="flow" x="30" y="307">date inventory released</text>

  <!-- Review gate note -->
  <rect x="450" y="270" width="290" height="88" rx="8" fill="#fbfbfb" stroke="#888" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text class="elbl" x="595" y="295" text-anchor="middle">Review gate (proof-of-stay)</text>
  <text class="sub" x="595" y="316" text-anchor="middle">addReview requires a completed</text>
  <text class="sub" x="595" y="331" text-anchor="middle">on-chain check-in by the caller</text>
  <text class="sub" x="595" y="346" text-anchor="middle">for this listing</text>
  <path class="edge" d="M555,115 C565,180 580,215 592,268" stroke-dasharray="5 4"/>

  <!-- Caption note -->
  <text class="sub" x="30" y="440">P = price × nights × rooms. Guest pays 1.05P (price + 5% security deposit). Platform tax = 7% of P.</text>
  <text class="sub" x="30" y="456">Every transition regenerates the NFT's on-chain tokenURI; the Status attribute always reflects current state.</text>
</svg>
