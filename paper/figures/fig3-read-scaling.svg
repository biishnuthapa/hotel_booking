<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis { stroke:#222; stroke-width:1.5; }
    .grid { stroke:#ddd; stroke-width:1; }
    .tick { font-size:12px; fill:#333; }
    .alab { font-size:13.5px; fill:#111; font-weight:bold; }
    .v1 { stroke:#111; stroke-width:2.4; fill:none; }
    .v2 { stroke:#111; stroke-width:2.4; fill:none; stroke-dasharray:7 5; }
    .pt { fill:#111; }
    .leg { font-size:13px; fill:#111; }
    .note { font-size:11.5px; fill:#444; }
  </style>

  <!-- gridlines: 1M steps -->
  <line class="grid" x1="80" y1="303.9" x2="860" y2="303.9"/>
  <line class="grid" x1="80" y1="227.6" x2="860" y2="227.6"/>
  <line class="grid" x1="80" y1="151.4" x2="860" y2="151.4"/>
  <line class="grid" x1="80" y1="75.2" x2="860" y2="75.2"/>

  <!-- axes -->
  <line class="axis" x1="80" y1="60" x2="80" y2="380"/>
  <line class="axis" x1="80" y1="380" x2="860" y2="380"/>

  <!-- y ticks (gas) : 0, 1M, 2M, 3M, 4M ; yFor(g)=380 - g/4.2e6*320 -->
  <text class="tick" x="72" y="384" text-anchor="end">0</text>
  <text class="tick" x="72" y="308" text-anchor="end">1M</text>
  <text class="tick" x="72" y="232" text-anchor="end">2M</text>
  <text class="tick" x="72" y="156" text-anchor="end">3M</text>
  <text class="tick" x="72" y="80" text-anchor="end">4M</text>

  <!-- x ticks -->
  <text class="tick" x="87.8" y="398" text-anchor="middle">1</text>
  <text class="tick" x="158" y="398" text-anchor="middle">10</text>
  <text class="tick" x="275" y="398" text-anchor="middle">25</text>
  <text class="tick" x="470" y="398" text-anchor="middle">50</text>
  <text class="tick" x="860" y="398" text-anchor="middle">100</text>

  <!-- axis labels -->
  <text class="alab" x="470" y="430" text-anchor="middle">Listings in catalog (N)</text>
  <text class="alab" x="24" y="220" transform="rotate(-90 24 220)" text-anchor="middle">estimateGas (gas units)</text>

  <!-- V1 line: (87.8,375.2)(158,348.6)(275,303.9)(470,228.3)(860,72.9) -->
  <polyline class="v1" points="87.8,375.2 158,348.6 275,303.9 470,228.3 860,72.9"/>
  <circle class="pt" cx="87.8" cy="375.2" r="4"/>
  <circle class="pt" cx="158" cy="348.6" r="4"/>
  <circle class="pt" cx="275" cy="303.9" r="4"/>
  <circle class="pt" cx="470" cy="228.3" r="4"/>
  <circle class="pt" cx="860" cy="72.9" r="4"/>

  <!-- V2 line: (87.8,375.8)(158,361.0)(275,336.2)(470,336.2)(860,336.2) -->
  <polyline class="v2" points="87.8,375.8 158,361.0 275,336.2 470,336.2 860,336.2"/>
  <rect class="pt" x="83.8" y="371.8" width="8" height="8"/>
  <rect class="pt" x="154" y="357.0" width="8" height="8"/>
  <rect class="pt" x="271" y="332.2" width="8" height="8"/>
  <rect class="pt" x="466" y="332.2" width="8" height="8"/>
  <rect class="pt" x="856" y="332.2" width="8" height="8"/>

  <!-- annotations -->
  <text class="leg" x="700" y="60">V1 getApartments(): O(N)</text>
  <text class="note" x="700" y="76">4.03M gas at N=100</text>
  <text class="leg" x="640" y="298">V2 paginated (page=25): bounded</text>
  <text class="note" x="640" y="314">flat ≈575k gas for any N ≥ 25</text>

  <!-- legend -->
  <line class="v1" x1="100" y1="95" x2="150" y2="95"/>
  <circle class="pt" cx="125" cy="95" r="4"/>
  <text class="leg" x="158" y="100">V1 — unbounded read (all listings)</text>
  <line class="v2" x1="100" y1="120" x2="150" y2="120"/>
  <rect class="pt" x="121" y="116" width="8" height="8"/>
  <text class="leg" x="158" y="125">V2 — cursor pagination (page of 25)</text>
</svg>
